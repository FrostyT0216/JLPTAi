name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Wrangler
        run: npm install -g wrangler

      - name: 验证 Cloudflare 凭据
        run: wrangler whoami

      - name: 确保 Pages 项目存在（已存在则跳过）
        run: wrangler pages project create jlpt-reading --production-branch=main || true

      - name: 部署到 Cloudflare Pages
        run: wrangler pages deploy . --project-name=jlpt-reading --branch=main --commit-dirty=true
